<section class="hero">
  <img src="{{ '/assets/images/seth-photo.svg' | relative_url }}" alt="Photo of {{ site.author }}" class="hero__photo" width="180" height="180">
  <h1 class="hero__name">{{ site.author }}</h1>
  <p class="hero__tagline">{{ site.tagline }}</p>
  <div class="hero__bio">
    {{ content }}
  </div>
</section>
