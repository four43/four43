<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Harvest</title>
<meta name="description" content="Drive the combine, harvest the fields, sell the grain and upgrade your machine.">
<meta name="theme-color" content="#bfe6f5">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Harvest">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#5a3820;--panel:rgba(255,252,248,.94);--edge:#6b4428;--sky:#bfe6f5;font-family:"Sniglet","Arial Rounded MT Bold",ui-rounded,system-ui,sans-serif}
html,body{height:var(--app-h,100%);margin:0;-webkit-text-size-adjust:100%;overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
body{position:relative;background:var(--sky);color:var(--ink)} /* the canvas and #ui fill the body, so --app-h reaches them */
*,*::before,*::after{box-sizing:border-box}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:absolute;inset:0;pointer-events:none;z-index:5}
#ui button,#ui .hv-card{pointer-events:auto}
#loading{position:absolute;inset:0;display:grid;place-items:center;font-size:28px;z-index:20;background:var(--sky)}
#stickBase{position:absolute;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.28);border:3px solid rgba(90,56,32,.5);z-index:6;pointer-events:none;display:grid;place-items:center;transform:translate(-50%,-50%)}
#stickBase[hidden]{display:none}
#stickKnob{width:64px;height:64px;border-radius:50%;background:#f5c84c;box-shadow:inset 0 0 0 3px #b07a12}
/* HUD */
.hv-top{position:absolute;top:calc(var(--lh-sa-top,0px) + 16px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
.hv-coins{display:flex;align-items:center;gap:6px;padding:4px 18px 4px 6px;border-radius:30px;background:var(--panel);border:4px solid var(--edge);box-shadow:0 4px 0 rgba(107,68,40,.4);font:800 30px/1 Sniglet,system-ui}
.hv-coins svg{width:38px;height:38px}
.hv-coins.bump{animation:bump .3s ease-out}
@keyframes bump{50%{transform:scale(1.15)}}
.hv-load{display:flex;align-items:center;gap:8px;padding:4px 10px;border-radius:14px;background:var(--panel);border:3px solid var(--edge)}
.hv-bars{display:flex;gap:4px;width:min(260px,52vw);height:18px}
.hv-seg{flex:1 1 0;border-radius:6px;background:#e8dcc6;overflow:hidden;border:2px solid #b89a70}
.hv-seg i{display:block;height:100%;background:#f2c230;transform-origin:left;transform:scaleX(0);transition:transform .15s}
.hv-loadn{font:800 16px/1 Sniglet,system-ui;min-width:72px;text-align:right;white-space:nowrap}
.hv-full{position:absolute;top:calc(var(--lh-sa-top,0px) + 148px);left:50%;transform:translateX(-50%);padding:6px 22px;border-radius:22px;background:#d84a3a;color:#fff;font:400 26px/1.1 Sniglet,system-ui;border:4px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.25);animation:pulse 1s ease-in-out infinite}
.hv-full b{font-weight:800}
.hv-tip{background:#e8a21a;font-size:22px;animation:none;white-space:nowrap}
.hv-full[hidden],.hv-arrow[hidden],.hv-done[hidden],.hv-field[hidden]{display:none}
.hv-field{display:flex;align-items:center;gap:6px;padding:3px 10px;border-radius:12px;background:var(--panel);border:3px solid var(--edge);font:800 15px/1 Sniglet,system-ui;white-space:nowrap}
.hv-field>i{width:14px;height:14px;border-radius:50%;border:2px solid var(--edge)}
.hv-fbar{width:70px;height:10px;border-radius:5px;background:#e8dcc6;overflow:hidden;border:2px solid #b89a70}
.hv-fbar i{display:block;height:100%;background:#3f9b3a;transform-origin:left;transform:scaleX(0);transition:transform .3s}
.hv-done{position:absolute;top:max(46%,calc(var(--lh-sa-top,0px) + 330px));left:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 30px;border-radius:24px;background:#3f9b3a;color:#fff;border:5px solid #fff;box-shadow:0 6px 0 rgba(0,0,0,.25);text-align:center;animation:donein .5s cubic-bezier(.3,1.6,.6,1)}
.hv-done b{font:800 40px/1.1 Sniglet,system-ui}
.hv-done span{font:400 22px/1.2 Sniglet,system-ui}
@keyframes donein{from{transform:translate(-50%,-50%) scale(.4);opacity:0}}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.06)}}
.hv-arrow{position:absolute;top:calc(var(--lh-sa-top,0px) + 200px);left:50%;width:64px;height:64px;transform-origin:50% 50%}
.hv-arrow svg{width:100%;height:100%}
.hv-fly{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;transition:transform .6s cubic-bezier(.4,-.3,.7,1),opacity .6s;z-index:7;pointer-events:none}
.hv-fly svg{width:100%;height:100%}
/* cards */
.hv-card{position:absolute;right:calc(var(--lh-sa-right,0px) + 14px);top:50%;transform:translateY(-50%);width:min(440px,calc(100vw - 28px));padding:14px 16px 16px;border-radius:22px;background:var(--panel);border:5px solid var(--edge);box-shadow:0 8px 0 rgba(107,68,40,.35);display:flex;flex-direction:column;gap:10px;max-height:calc(100% - var(--lh-sa-top,0px) - var(--lh-sa-bottom,0px) - 28px);overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;animation:cardin .25s ease-out;z-index:8}
@keyframes cardin{from{transform:translateY(-50%) translateX(40px);opacity:0}}
.hv-card h2{margin:0 52px 0 4px;min-height:44px;display:flex;align-items:center;font:800 28px/1.1 Sniglet,system-ui;align-self:flex-start}
.hv-card p{margin:0;font-size:18px}
.hv-x{all:unset;position:absolute;top:8px;right:8px;width:52px;height:52px;border-radius:50%;background:#d84a3a;border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.25);display:grid;place-items:center;cursor:pointer}
.hv-x svg{width:30px;height:30px}
.hv-row{display:grid;grid-template-columns:minmax(0,auto) minmax(96px,1fr) auto;grid-template-rows:auto auto;column-gap:10px;align-items:center;padding:6px 8px;border-radius:14px;background:rgba(232,220,198,.55)}
.hv-name{display:flex;align-items:center;gap:6px;font-size:20px;grid-row:1/3}
.hv-icon svg{width:44px;height:44px;display:block}
.hv-pips{display:flex;flex-wrap:wrap;gap:4px}
.hv-pips i{width:14px;height:14px;border-radius:50%;background:#e2d4bb;border:2px solid #b89a70}
.hv-pips i.on{background:#3f9b3a;border-color:#2c6d29}
.hv-val{font-size:15px;color:#7a5634}
.hv-buy{all:unset;grid-row:1/3;grid-column:3;display:flex;align-items:center;gap:4px;box-sizing:border-box;width:132px;min-height:56px;justify-content:center;padding:0 8px;border-radius:16px;background:#3f9b3a;color:#fff;font:800 24px/1 Sniglet,system-ui;border:3px solid #2c6d29;box-shadow:0 4px 0 #2c6d29;cursor:pointer}
.hv-buy svg{width:28px;height:28px;flex:none}.hv-buy.long{font-size:19px}
.hv-vehs{display:flex;gap:8px}
.hv-veh{all:unset;box-sizing:border-box;flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;border-radius:14px;background:#3a7bd5;color:#fff;border:3px solid #24569c;box-shadow:0 4px 0 #24569c;cursor:pointer;text-align:center}
.hv-veh b{font:800 20px/1 Sniglet,system-ui;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.hv-veh span{display:flex;align-items:center;gap:3px;font:800 15px/1 Sniglet,system-ui}
.hv-veh span svg{width:18px;height:18px}
.hv-veh.on{background:#f5c84c;color:var(--ink);border-color:#b07a12;box-shadow:0 4px 0 #b07a12}
.hv-veh:disabled:not(.on){background:#b8ad9c;border-color:#8e8475;box-shadow:0 4px 0 #8e8475;cursor:default}
.hv-buy:disabled{background:#b8ad9c;border-color:#8e8475;box-shadow:0 4px 0 #8e8475;cursor:default}
.hv-buy:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #2c6d29}
#tune{position:absolute;left:8px;bottom:8px;z-index:9;background:rgba(255,255,255,.92);padding:8px;border-radius:10px;font:14px system-ui;color:#222;touch-action:pan-y}
#tune label{display:grid;grid-template-columns:90px 160px 48px;gap:6px;align-items:center;min-height:36px}
@media (max-width:520px){.hv-name b{display:none}.hv-pips i{width:11px;height:11px}.hv-buy{width:108px;min-height:50px;font-size:20px}.hv-buy svg{width:24px;height:24px}.hv-buy.long{font-size:15px;padding:0 4px}.hv-buy.long svg{width:18px;height:18px}.hv-vehs{gap:6px}.hv-veh{padding:6px 4px}.hv-veh b{font-size:16px}.hv-veh span{font-size:13px}.hv-card{gap:8px;padding:12px 12px 14px}.hv-row{padding:4px 8px}.hv-tip{font-size:17px}.hv-done b{font-size:32px}}
@media (max-height:520px){.hv-coins{font-size:22px;padding:2px 14px 2px 4px}.hv-coins svg{width:28px;height:28px}.hv-bars{width:min(180px,40vw);height:14px}.hv-loadn{font-size:14px;min-width:60px}.hv-field{font-size:13px}.hv-full{top:calc(var(--lh-sa-top,0px) + 110px);font-size:20px}.hv-arrow{top:calc(var(--lh-sa-top,0px) + 146px);width:48px;height:48px}
  #ui:has(#shop) .hv-top{left:calc(var(--lh-sa-left,0px) + 12px);transform:none;align-items:flex-start}
  .hv-card{top:calc(var(--lh-sa-top,0px) + 14px);transform:none;max-height:calc(100% - var(--lh-sa-top,0px) - var(--lh-sa-bottom,0px) - 16px);width:min(440px,calc(100vw - var(--lh-sa-left,0px) - var(--lh-sa-right,0px) - 330px))}@keyframes cardin{from{transform:translateX(40px);opacity:0}}
  .hv-name b{display:none}.hv-val{font-size:14px}.hv-card h2{display:none}.hv-done{top:55%;padding:8px 22px}.hv-done b{font-size:28px}.hv-done span{font-size:17px}.hv-vehs{margin-right:52px}.hv-buy{min-height:42px}.hv-pips i{width:11px;height:11px}.hv-veh{padding:3px 6px}.hv-veh b{font-size:16px}.hv-card{gap:5px;padding:8px 12px 10px}.hv-card h2{font-size:22px}.hv-row{padding:2px 8px}.hv-icon svg{width:34px;height:34px}.hv-buy{min-height:44px;font-size:20px}.hv-x{width:44px;height:44px}}
@media (orientation:portrait){.hv-card{right:50%;top:auto;bottom:calc(var(--lh-sa-bottom,0px) + 14px);transform:translateX(50%);max-height:calc(100% - var(--lh-sa-top,0px) - var(--lh-sa-bottom,0px) - 156px)}@keyframes cardin{from{transform:translateX(50%) translateY(40px);opacity:0}}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"><div id="stickBase" hidden><div id="stickKnob"></div></div></div>
<div id="loading">Harvest…</div>
<script>
// iOS home-screen apps with a translucent status bar report a viewport about one status bar short, leaving a gap at the bottom
// (as Tractor Pickup and Pig Pens): installed and spanning the screen's width, use the screen's full height. In the browser the
// window height is right (its toolbars are real).
(function fitHeight() {
  const installed = navigator.standalone || matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches;
  const set = () => {
    if (!installed) { document.documentElement.style.setProperty('--app-h', innerHeight + 'px'); return; }
    const sw = screen.width, sh = screen.height, land = innerWidth > innerHeight;
    const fullW = land ? Math.max(sw, sh) : Math.min(sw, sh), fullH = land ? Math.min(sw, sh) : Math.max(sw, sh);
    const h = Math.abs(innerWidth - fullW) < 2 ? Math.max(innerHeight, fullH) : innerHeight;
    document.documentElement.style.setProperty('--app-h', h + 'px');
  };
  set(); addEventListener('resize', set);
})();
</script>
<!--APP-->
<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(e => console.warn('service worker', e)));</script>
</body>
</html>
