<link href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#f6a9bd; --snout:#d9667f; --mud:#6b4428; --hay:#f5c84c; --panel:rgba(255,252,248,.9); --ink:#5a3820; --sky:#bfe6f5;
  box-sizing:border-box;
  font-family:"Sniglet","Arial Rounded MT Bold",ui-rounded,"Trebuchet MS",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --panel:rgba(58,40,28,.88); --ink:#ffe9df; --mud:#2b1a0f; } }
:root[data-theme="dark"]{ --panel:rgba(58,40,28,.88); --ink:#ffe9df; --mud:#2b1a0f; }
html,body{height:var(--app-h,100%);overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;position:relative;background:var(--sky);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:absolute;top:0;left:0;width:100%;height:100%;display:block;touch-action:none}
.chunk{background:var(--panel);border:2.5px solid var(--mud);box-shadow:0 4px 0 var(--mud);border-radius:22px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#tools{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--lh-sa-bottom,env(safe-area-inset-bottom,0px)) + 14px);display:flex;gap:4px;padding:5px;z-index:5}
#tools button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:62px;height:62px;border-radius:17px;color:var(--ink);font-weight:800;font-size:14px;letter-spacing:.01em;transition:transform .08s,background .15s}
#tools button svg{width:27px;height:27px}
#tools button{position:relative}
#snacks{position:absolute;top:3px;right:7px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:#e8483f;color:#fff;font-size:12px;line-height:19px;text-align:center;font-weight:800}
#snacks.empty{background:#a99382}
#tools button[aria-pressed="true"]{background:var(--pink);color:#5a2232;box-shadow:inset 0 0 0 2.5px var(--snout)}
#tools button:active{transform:translateY(2px)}
#tools button:focus-visible,.round:focus-visible{outline:3px solid #2f7de1;outline-offset:2px}
#top{position:fixed;right:calc(var(--lh-sa-right,env(safe-area-inset-right,0px)) + 12px);top:calc(var(--lh-sa-top,env(safe-area-inset-top,0px)) + 12px);display:flex;gap:8px;align-items:flex-start;z-index:5}
.round{all:unset;cursor:pointer;width:46px;height:46px;display:grid;place-items:center;border-radius:50%;color:var(--ink)}
.round svg{width:27px;height:27px}
#bell{background:var(--hay);color:#5a3820}
.round:active{transform:translateY(2px);box-shadow:0 2px 0 var(--mud)}
#hint{position:absolute;left:50%;bottom:calc(var(--lh-sa-bottom,env(safe-area-inset-bottom,0px)) + 98px);z-index:5;transform:translate(-50%,8px);max-width:min(90vw,560px);text-align:center;padding:10px 20px;font-size:21px;font-weight:800;line-height:1.3;letter-spacing:.02em;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:4;border-radius:16px}
#hint.on{opacity:1;transform:translate(-50%,0)}
#timecol{display:flex;flex-direction:row-reverse;align-items:center;gap:8px}
#daynight{all:unset;cursor:pointer;position:relative;display:flex;height:38px;padding:4px;border-radius:25px;gap:2px}
#daynight .opt{width:38px;height:38px;border-radius:19px;display:grid;place-items:center;color:var(--ink);transition:background .2s,color .2s}
#daynight .opt svg{width:22px;height:22px}
#daynight[aria-pressed="false"] .sun{background:var(--hay);color:#5a3820}
#daynight[aria-pressed="true"] .moon{background:#2b3a66;color:#ffe9a8}
#daynight:focus-visible{outline:3px solid #2f7de1;outline-offset:2px}
#eggs{box-sizing:content-box;display:flex;align-items:center;gap:5px;height:46px;min-width:22px;padding:0 14px 0 10px;border-radius:23px;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
#eggs svg{width:26px;height:26px}
#eggs.bump{animation:eggbump .35s ease-out}
@keyframes eggbump{40%{transform:scale(1.18)}}
.eggpop{position:absolute;left:0;top:0;z-index:4;pointer-events:none;font-size:54px;font-weight:800;line-height:1;color:#fff6e6;-webkit-text-stroke:3px var(--mud);paint-order:stroke fill;text-shadow:0 4px 0 var(--mud);will-change:transform,opacity}
#card{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--lh-sa-bottom,env(safe-area-inset-bottom,0px)) + 96px);width:min(92vw,380px);padding:12px 44px 12px 16px;z-index:6;border-radius:20px}
#card h2{margin:0;font-size:21px;font-weight:800;line-height:1.1}
#card p{margin:3px 0 0;font-size:14px;line-height:1.3}
#cardSub{opacity:.75} #cardDoing{font-weight:800}
#cardClose{all:unset;cursor:pointer;position:absolute;right:8px;top:8px;width:32px;height:32px;display:grid;place-items:center;font-size:24px;border-radius:50%}
#cardClose:focus-visible{outline:3px solid #2f7de1}
.bar{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:13px}
.bar span{width:52px} .bar i{flex:1;height:9px;border-radius:5px;background:rgba(107,68,40,.18);overflow:hidden} .bar b{display:block;height:100%;border-radius:5px}
.bar.hunger b{background:#f2a33a} .bar.mud b{background:#7a5434} .bar.fright b{background:#e8483f}
.facts{display:flex;gap:14px;margin-top:6px;font-size:13px}
#outside{all:unset;cursor:pointer;position:fixed;left:calc(var(--lh-sa-left,env(safe-area-inset-left,0px)) + 12px);top:calc(var(--lh-sa-top,env(safe-area-inset-top,0px)) + 12px);z-index:5;display:flex;align-items:center;gap:6px;height:46px;padding:0 18px 0 12px;border-radius:23px;font-weight:800;font-size:16px;color:var(--ink)}
#outside[hidden]{display:none}
#say{position:absolute;left:0;top:0;z-index:4;max-width:min(82vw,400px);padding:12px 20px;font-size:27px;font-weight:800;line-height:1.25;letter-spacing:.02em;text-align:center;border-radius:18px;pointer-events:none;will-change:transform;transition:opacity .2s}
#say::after{content:"";position:absolute;left:50%;bottom:-11px;margin-left:-9px;border:9px solid transparent;border-top-color:var(--mud);border-bottom:0}
#say[hidden]{display:block;opacity:0}
#outside svg{width:24px;height:24px}
#outside:active{transform:translateY(2px);box-shadow:0 2px 0 var(--mud)}
#outside:focus-visible{outline:3px solid #2f7de1;outline-offset:2px}
/* 2.14.0: in the exam room, how many patients still need help (a face each), counting down as each walks out better */
#patients{position:fixed;left:50%;top:calc(var(--lh-sa-top,env(safe-area-inset-top,0px)) + 12px);transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:8px;height:46px;padding:0 18px 0 10px;border-radius:23px;font-weight:800;font-size:22px;color:var(--ink);white-space:nowrap;pointer-events:none}
#patients[hidden]{display:none}
#patients svg{width:30px;height:30px;flex:none}
#patients.done{padding-left:18px}
#patients.bump{animation:eggbump .35s ease-out}
#loading{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:800;color:#5a3820;background:var(--sky);z-index:10}
:is(#daynight,#bell,#outside).chunk{background:var(--panel);border:2.5px solid var(--mud);box-shadow:0 4px 0 var(--mud)}
#bell.chunk{background:var(--hay)}
/* 2.12.0: the game is played sideways on a phone or tablet. An installed app is locked to landscape (manifest); in the
   browser (iOS can't lock) a touch screen held upright gets this card over the game until it is turned */
#turn{display:none;position:fixed;inset:0;z-index:20;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:var(--sky);color:#5a3820;font-size:30px;font-weight:800;text-align:center;padding:24px}
#turn svg{width:120px;height:120px;animation:turn 2.4s ease-in-out infinite}
@keyframes turn{0%,25%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (pointer:coarse){#turn{display:flex}}
@media (prefers-reduced-motion: reduce){#turn svg{animation:none;transform:rotate(-90deg)}}
@media (prefers-reduced-motion: reduce){#hint,#tools button{transition:none} #eggs.bump,#patients.bump{animation:none}}
@media (min-width:700px){#tools button{width:80px;font-size:15px}}
</style>
</head>
<body>
<canvas id="c" aria-label="Farm with a herd of pigs"></canvas>
<div id="top">
  <div id="timecol">
    <button id="daynight" data-lh-slot="farm.night" class="chunk" aria-pressed="false" aria-label="Day. Switch to night">
      <span class="opt sun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg></span>
      <span class="opt moon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></span>
    </button>
    <div id="eggs" class="chunk" aria-label="Eggs collected"><svg viewBox="0 0 24 24" fill="#fff6e6" stroke="currentColor" stroke-width="2"><path d="M12 3c3.5 0 6.5 5.5 6.5 10a6.5 6.5 0 0 1-13 0C5.5 8.5 8.5 3 12 3z"/></svg><span id="eggCount">0</span></div>
  </div>
  <button id="bell" data-lh-slot="farm.bell" class="round chunk" aria-label="Ring the dinner bell">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/><path d="M12 5V3.5"/></svg>
  </button>
</div>
<button id="outside" data-lh-slot="farm.back" class="chunk" hidden aria-label="Go back outside">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Outside</button>
<div id="hint" class="chunk" role="status" aria-live="polite"></div>
<div id="say" class="chunk" hidden aria-live="polite"></div>
<div id="patients" class="chunk" hidden role="status" aria-live="polite"><span id="patientFaces" aria-hidden="true"></span><span id="patientCount"></span></div>
<nav id="tools" class="chunk" aria-label="Tools">
  <button data-tool="hand" data-lh-slot="farm.tool.hand" aria-pressed="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V4.5a1.5 1.5 0 0 1 3 0V10"/><path d="M12 9.5a1.5 1.5 0 0 1 3 0V11"/><path d="M15 10.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-.6a5 5 0 0 1-4-2l-3-4a1.5 1.5 0 0 1 2.3-1.9L9 15"/><path d="M5 4.5 3.5 3M14.5 3 16 1.5"/></svg>Hand</button>
  <button data-tool="shoo" data-lh-slot="farm.tool.shoo" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="12" cy="16" rx="4.6" ry="3.8"/><ellipse cx="6" cy="10.5" rx="2" ry="2.5"/><ellipse cx="10" cy="6.8" rx="2" ry="2.6"/><ellipse cx="14.5" cy="6.8" rx="2" ry="2.6"/><ellipse cx="18.5" cy="10.5" rx="2" ry="2.5"/></svg>Shoo</button>
  <button data-tool="feed" data-lh-slot="farm.tool.feed" aria-pressed="false"><span id="snacks" aria-hidden="true">5</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7.5c-2-1.6-6.5-1.4-7 3.2-.5 4.4 2.6 9.8 5.2 9.8 1 0 1.3-.5 1.8-.5s.8.5 1.8.5c2.6 0 5.7-5.4 5.2-9.8-.5-4.6-5-4.8-7-3.2z"/><path d="M12 7.5c0-2 .8-3.5 2.5-4.3"/></svg>Feed</button>
  <button data-tool="hose" data-lh-slot="farm.tool.hose" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20c2.5 0 4-1.2 4-3.5V13a2 2 0 0 1 2-2h3"/><path d="M12 9h3.5l2 1.2v1.6l-2 1.2H12z"/><path d="M20 8.5v.01M21.5 11v.01M20 13.5v.01"/></svg>Hose</button>
  <button data-tool="grab" data-lh-slot="farm.tool.grab" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12V5.5a1.5 1.5 0 0 1 3 0V11"/><path d="M11 10.5V4a1.5 1.5 0 0 1 3 0v6.5"/><path d="M14 10.5V5.5a1.5 1.5 0 0 1 3 0V13"/><path d="M8 11.5l-1.2-1.4a1.6 1.6 0 0 0-2.5 2L8 17.5a6 6 0 0 0 5 3h.5a5 5 0 0 0 5-5V12a1.5 1.5 0 0 0-3 0"/></svg>Grab</button>
</nav>
<section id="card" class="chunk" hidden aria-live="polite">
  <button id="cardClose" data-lh-slot="farm.close" aria-label="Close">&times;</button>
  <h2 id="cardName"></h2><p id="cardSub"></p><p id="cardDoing"></p><div id="cardBars"></div>
</section>
<div id="turn" aria-live="polite"><svg viewBox="0 0 24 24" fill="#fff6e6" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><circle cx="12" cy="18.5" r=".9" fill="currentColor"/></svg>Turn me sideways!</div>
<div id="loading">Waking the pigs…</div>
<script>
// No page zoom: iOS ignores user-scalable=no, so block WebKit's pinch gestures directly.
// The game's own two-finger camera zoom uses pointer events and is unaffected.
for (const t of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(t, e => e.preventDefault(), { passive: false });
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
// iOS home-screen apps with a translucent status bar report a viewport about one status bar
// short, leaving a gap at the bottom. When installed and spanning the full screen width, use the
// full screen height instead. In the browser the window height is right (its toolbars are real).
(function fitHeight() {
  const installed = navigator.standalone || matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches;
  const set = () => {
    if (!installed) { document.documentElement.style.setProperty('--app-h', innerHeight + 'px'); return; }
    const sw = screen.width, sh = screen.height, land = innerWidth > innerHeight;
    const fullW = land ? Math.max(sw, sh) : Math.min(sw, sh), fullH = land ? Math.min(sw, sh) : Math.max(sw, sh);
    const h = Math.abs(innerWidth - fullW) < 2 ? Math.max(innerHeight, fullH) : innerHeight;
    document.documentElement.style.setProperty('--app-h', h + 'px');
  };
  set(); addEventListener('resize', set);
})();
</script>
<!--APP-->
<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(e => console.warn('service worker', e)));</script>
</body>
</html>
