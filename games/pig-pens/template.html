<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pig Pens</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#bfe6f5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pig Pens">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#f6a9bd; --snout:#d9667f; --mud:#6b4428; --hay:#f5c84c; --panel:rgba(255,252,248,.9); --ink:#5a3820; --sky:#bfe6f5;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:"Sniglet","Arial Rounded MT Bold",ui-rounded,"Trebuchet MS",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --panel:rgba(58,40,28,.88); --ink:#ffe9df; --mud:#2b1a0f; } }
:root[data-theme="dark"]{ --panel:rgba(58,40,28,.88); --ink:#ffe9df; --mud:#2b1a0f; }
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;overflow:hidden;background:var(--sky);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.chunk{background:var(--panel);border:2.5px solid var(--mud);box-shadow:0 4px 0 var(--mud);border-radius:22px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#tools{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:4px;padding:5px;z-index:5}
#tools button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:62px;height:62px;border-radius:17px;color:var(--ink);font-weight:800;font-size:14px;letter-spacing:.01em;transition:transform .08s,background .15s}
#tools button svg{width:27px;height:27px}
#tools button{position:relative}
#snacks{position:absolute;top:3px;right:7px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:#e8483f;color:#fff;font-size:12px;line-height:19px;text-align:center;font-weight:800}
#snacks.empty{background:#a99382}
#tools button[aria-pressed="true"]{background:var(--pink);color:#5a2232;box-shadow:inset 0 0 0 2.5px var(--snout)}
#tools button:active{transform:translateY(2px)}
#tools button:focus-visible,.round:focus-visible{outline:3px solid #2f7de1;outline-offset:2px}
#top{position:fixed;right:calc(env(safe-area-inset-right,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;gap:10px;z-index:5}
.round{all:unset;cursor:pointer;width:52px;height:52px;display:grid;place-items:center;border-radius:50%;color:var(--ink)}
.round svg{width:27px;height:27px}
#bell{background:var(--hay);color:#5a3820}
.round:active{transform:translateY(2px);box-shadow:0 2px 0 var(--mud)}
#mute[aria-pressed="true"] .on{display:none} #mute:not([aria-pressed="true"]) .off{display:none}
#miniwrap{position:fixed;left:calc(env(safe-area-inset-left,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 12px);padding:5px;z-index:5;border-radius:18px}
#mini{display:block;width:118px;height:118px;border-radius:13px;touch-action:none;cursor:pointer}
#hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 98px);transform:translate(-50%,8px);max-width:min(88vw,420px);text-align:center;padding:9px 16px;font-size:15px;line-height:1.3;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:4;border-radius:16px}
#hint.on{opacity:1;transform:translate(-50%,0)}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-size:22px;font-weight:800;color:#5a3820;background:var(--sky);z-index:10}
@media (prefers-reduced-motion: reduce){#hint,#tools button{transition:none}}
@media (min-width:700px){#mini{width:150px;height:150px} #tools button{width:80px;font-size:15px}}
</style>
</head>
<body>
<canvas id="c" aria-label="Farm with a herd of pigs"></canvas>
<div id="miniwrap" class="chunk"><canvas id="mini" aria-label="Farm map. Tap to move the view."></canvas></div>
<div id="top">
  <button id="bell" class="round chunk" aria-label="Ring the dinner bell">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/><path d="M12 5V3.5"/></svg>
  </button>
  <button id="mute" class="round chunk" aria-pressed="false" aria-label="Turn sound off">
    <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
    <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
  </button>
</div>
<div id="hint" class="chunk" role="status" aria-live="polite"></div>
<nav id="tools" class="chunk" aria-label="Tools">
  <button data-tool="shoo" aria-pressed="true">
    <svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="12" cy="16" rx="4.6" ry="3.8"/><ellipse cx="6" cy="10.5" rx="2" ry="2.5"/><ellipse cx="10" cy="6.8" rx="2" ry="2.6"/><ellipse cx="14.5" cy="6.8" rx="2" ry="2.6"/><ellipse cx="18.5" cy="10.5" rx="2" ry="2.5"/></svg>Shoo</button>
  <button data-tool="feed" aria-pressed="false"><span id="snacks" aria-hidden="true">5</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7.5c-2-1.6-6.5-1.4-7 3.2-.5 4.4 2.6 9.8 5.2 9.8 1 0 1.3-.5 1.8-.5s.8.5 1.8.5c2.6 0 5.7-5.4 5.2-9.8-.5-4.6-5-4.8-7-3.2z"/><path d="M12 7.5c0-2 .8-3.5 2.5-4.3"/></svg>Feed</button>
  <button data-tool="hose" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20c2.5 0 4-1.2 4-3.5V13a2 2 0 0 1 2-2h3"/><path d="M12 9h3.5l2 1.2v1.6l-2 1.2H12z"/><path d="M20 8.5v.01M21.5 11v.01M20 13.5v.01"/></svg>Hose</button>
  <button data-tool="grab" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12V5.5a1.5 1.5 0 0 1 3 0V11"/><path d="M11 10.5V4a1.5 1.5 0 0 1 3 0v6.5"/><path d="M14 10.5V5.5a1.5 1.5 0 0 1 3 0V13"/><path d="M8 11.5l-1.2-1.4a1.6 1.6 0 0 0-2.5 2L8 17.5a6 6 0 0 0 5 3h.5a5 5 0 0 0 5-5V12a1.5 1.5 0 0 0-3 0"/></svg>Grab</button>
  <button data-tool="look" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 0 1-13.7 5.6"/><path d="M4 12a8 8 0 0 1 13.7-5.6"/><path d="M17.5 3v3.8h-3.8"/><path d="M6.5 21v-3.8h3.8"/><circle cx="12" cy="12" r="2.2"/></svg>Look</button>
</nav>
<div id="loading">Waking the pigs…</div>
<script><!--APP--></script>
<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(e => console.warn('service worker', e)));</script>
</body>
</html>
