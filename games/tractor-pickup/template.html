<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Sniglet:wght@400;800&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#f6a9bd; --snout:#d9667f; --mud:#6b4428; --hay:#f5c84c; --panel:rgba(255,252,248,.9); --ink:#5a3820; --sky:#bfe6f5;
  box-sizing:border-box;
  font-family:"Sniglet","Arial Rounded MT Bold",ui-rounded,"Trebuchet MS",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --panel:rgba(58,40,28,.88); --ink:#ffe9df; --mud:#2b1a0f; } }
:root[data-theme="dark"]{ --panel:rgba(58,40,28,.88); --ink:#ffe9df; --mud:#2b1a0f; }
html,body{height:var(--app-h,100%);overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;position:relative;background:var(--sky);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:absolute;top:0;left:0;width:100%;height:100%;display:block;touch-action:none}
#stickBase{position:absolute;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.28);border:3px solid rgba(90,56,32,.5);z-index:6;pointer-events:none;display:grid;place-items:center}
#stickBase[hidden]{display:none}
#stickKnob{width:64px;height:64px;border-radius:50%;background:#f6a9bd;box-shadow:inset 0 0 0 3px #d9667f}
#horn{all:unset;position:absolute;right:calc(env(safe-area-inset-right,0px) + 24px);bottom:calc(env(safe-area-inset-bottom,0px) + 24px);width:110px;height:110px;border-radius:50%;background:#f5c84c;border:4px solid #6b4428;box-shadow:0 5px 0 #6b4428;font-size:56px;display:grid;place-items:center;z-index:6;cursor:pointer}
#horn:active{transform:translateY(3px);box-shadow:0 2px 0 #6b4428}
#tune{color-scheme:light;color:#222;position:absolute;top:8px;left:8px;z-index:9;background:rgba(255,255,255,.92);padding:8px;border-radius:10px;font:15px system-ui;max-height:80vh;overflow:auto;touch-action:pan-y;width:max-content;max-width:min(420px,60vw)}
#tune label,#tune span,#tune output{color:#222}
#tune input[type=range]{accent-color:#d8342c}
#tune button,#tune select{color:#222;background:#fff;border:2px solid #555}
#tune button{font:inherit;padding:6px 14px;border-radius:8px}
#tune label{width:min(400px,56vw);display:grid;grid-template-columns:130px 1fr 52px;gap:8px;align-items:center;min-height:44px}
#tune input[type=range]{width:100%;height:36px;touch-action:pan-y}
#tune select{font:inherit;min-height:44px;margin-top:6px}
#slots{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:5;pointer-events:none}
.slot{width:62px;height:72px;border-radius:14px;background:rgba(255,255,255,.45);border:3px dashed rgba(107,68,40,.55);display:flex;flex-direction:column;align-items:center;justify-content:center}
.slot.full{background:rgba(255,252,248,.92);border:3px solid #6b4428;animation:pop .35s ease-out}
.slot.wagon{margin-left:18px}
.slot img{width:52px;height:52px}.slot span{font:700 12px Andika,system-ui;color:#5a3820;line-height:1;white-space:nowrap}
#word{position:absolute;top:110px;left:50%;transform:translateX(-50%);font:700 96px/1 Andika,system-ui;color:#fff;-webkit-text-stroke:4px #6b4428;paint-order:stroke;z-index:6;opacity:0;pointer-events:none}
#word.on{opacity:1;pointer-events:auto}
#word span{display:inline-block;transform:scale(0);animation:pop .3s ease-out forwards}
#arrow{position:absolute;z-index:6;font-size:64px;color:#f5c84c;-webkit-text-stroke:3px #6b4428;pointer-events:none}
#show{position:absolute;inset:0;z-index:8;pointer-events:auto}
#show .num,#show .name,#show .group{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font:700 44px Andika,system-ui;color:#fff;-webkit-text-stroke:3px #6b4428;paint-order:stroke;animation:popc .35s ease-out}
#show .num{font-size:36px}
#show .name{font-size:34px}
#show .group{display:flex;align-items:baseline;gap:.3em;font-size:36px}
#show .gn{font-size:40px}
#show .big{position:absolute;top:calc(env(safe-area-inset-top,0px) + 96px);left:50%;transform:translateX(-50%);white-space:nowrap;font:700 150px Andika,system-ui;color:#fff;-webkit-text-stroke:5px #6b4428;paint-order:stroke;opacity:0}
#show .big.on{opacity:1;animation:popx .4s ease-out}
#show b{display:inline-block;animation:glow .5s ease-out both}
#show .num small{display:block;font-size:24px;color:#ffe066;line-height:1}
#show .big .t{display:inline-block;color:#fff;opacity:.45;transition:opacity .2s,transform .2s,color .2s}
#show .big .t.lit{opacity:1;color:#fff1a0;transform:scale(1.12)}
#show .group.glow .gn,#show .group.glow .gw{color:#fff1a0}
/* start screen, sticker card, sticker book, parent gear and menu (Task 14) */
.screen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;background:rgba(191,230,245,.82);pointer-events:auto}
.screen.reward{background:rgba(255,246,220,.9)}
.screen.book{background:rgba(255,246,220,.96);justify-content:flex-start;overflow:auto;touch-action:pan-y;padding:calc(env(safe-area-inset-top,0px) + 24px) 24px 24px}
.pic{all:unset;box-sizing:border-box;cursor:pointer;display:grid;place-items:center;border-radius:28px;background:#fffcf8;border:5px solid #6b4428;box-shadow:0 7px 0 #6b4428;-webkit-tap-highlight-color:transparent}
.pic:active{transform:translateY(4px);box-shadow:0 3px 0 #6b4428}
.pic svg{width:80%;height:80%}
.go{position:absolute;right:calc(env(safe-area-inset-right,0px) + 28px);bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
.pic.go{width:min(22vh,150px);height:min(22vh,150px);border-radius:50%;background:#3fae4a;border-color:#1f6b28;box-shadow:0 8px 0 #1f6b28;animation:pulse 1.6s ease-in-out infinite}
.pic.go svg{width:62%;height:62%;margin-left:8%}
.paintpanel{display:flex;align-items:center;gap:3vw;max-width:94vw}
.paintpanel .preview{width:min(38vw,44vh,360px);aspect-ratio:4/3;border-radius:28px;background:radial-gradient(#fffcf8,#e9dcc6);border:5px solid #6b4428;display:grid;place-items:center;overflow:hidden}
.paintpanel .preview img{width:100%;height:100%;object-fit:contain}
.paintpanel .rows{display:flex;flex-direction:column;gap:3vh}
.prow{display:flex;align-items:center;gap:14px}
.prow .area{width:min(14vh,104px);flex:none}
.prow .area svg{width:100%;height:auto;display:block}
.pots{display:grid;grid-template-columns:repeat(5,auto);gap:10px}
.pic.pot{width:min(10vh,74px);height:min(10vh,74px);border-radius:20px;border-width:4px;box-shadow:0 4px 0 #6b4428}
.pic.pot svg{width:88%;height:88%}
.pic.pot.on{border-color:#e6b422;background:#fff3b0;box-shadow:0 0 0 5px #f5c84c,0 4px 0 #6b4428}
.pic.pot.fresh{animation:bounce .9s .5s ease-out both,glowpot 1.2s 1.4s ease-in-out 3}
.rewardtop{display:flex;align-items:center;gap:28px}
.screen.reward.withpaint .bigsticker .portrait{width:min(26vh,200px);height:min(26vh,200px)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes glowpot{0%,100%{box-shadow:0 0 0 0 #fff1a0,0 4px 0 #6b4428}50%{box-shadow:0 0 22px 10px #fff1a0,0 4px 0 #6b4428}}
.pic.bookbtn{position:absolute;left:calc(env(safe-area-inset-left,0px) + 24px);bottom:calc(env(safe-area-inset-bottom,0px) + 24px);width:110px;height:88px}
.pic.bookbtn.small{width:84px;height:68px}
.bigsticker .portrait{width:min(40vh,300px);height:min(40vh,300px);animation:grow .7s cubic-bezier(.2,1.4,.4,1) both}
.portrait{border-radius:50%;background:#fffcf8;border:8px solid #6b4428;display:grid;place-items:center;overflow:hidden}
.portrait.golden{border-color:#e6b422;box-shadow:0 0 0 6px #fff1a0,0 0 26px 8px #f5c84c;background:#fff8d6}
.portrait img{width:92%;height:92%;object-fit:contain}
.extra{width:min(22vh,150px);height:min(15vh,100px);animation:bounce .9s .5s ease-out both}
.extra svg,.extra img{width:100%;height:100%}
.extra.hatted{position:relative;width:min(16vh,110px);height:min(16vh,110px)}
.extra.hatted span{position:absolute;left:22%;top:-8%;width:50%}
.pic.x{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);left:calc(env(safe-area-inset-left,0px) + 16px);width:76px;height:76px;background:#d8342c;border-radius:50%;z-index:2}
.pic.x svg{width:55%;height:55%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,130px);justify-content:center;gap:18px;width:min(900px,92vw);margin:80px auto 0}
.grid .portrait{width:100%;aspect-ratio:1;border-width:5px}
.grid .empty svg{width:200px}
.gear{all:unset;position:absolute;z-index:25;top:calc(env(safe-area-inset-top,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 10px);width:46px;height:46px;border-radius:50%;background:rgba(255,252,248,.75);display:grid;place-items:center;touch-action:none;-webkit-touch-callout:none}
.gear svg{width:30px;height:30px}
.gear i{position:absolute;inset:-3px;border-radius:50%;--p:0deg;background:conic-gradient(#f5c84c var(--p),transparent 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));pointer-events:none}
.parent{position:absolute;inset:0;z-index:30;background:rgba(40,25,15,.55);display:grid;place-items:center;pointer-events:auto;touch-action:pan-y}
.parent .box{background:#fffcf8;color:#3a2412;border-radius:18px;padding:18px 22px;width:min(520px,92vw);max-height:92vh;overflow:auto;font:16px/1.4 Andika,system-ui,sans-serif;user-select:auto;-webkit-user-select:auto}
.parent h2{margin:0 0 8px;font-size:22px}
.parent fieldset{border:2px solid #d9c3a4;border-radius:10px;margin:8px 0;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
.parent label{min-height:44px;display:inline-flex;align-items:center;gap:8px}
.parent input[type=number]{font:inherit;width:8em;padding:6px;border:2px solid #a98a63;border-radius:8px}
.parent input[type=radio],.parent input[type=checkbox]{width:24px;height:24px}
.parent .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.parent button{font:inherit;min-height:48px;padding:6px 18px;border-radius:12px;border:2px solid #6b4428;background:#fff;color:#3a2412;cursor:pointer}
.parent button.primary{background:#f5c84c;font-weight:700}
@keyframes bob{50%{transform:translateY(-8px) rotate(-1.5deg)}}
@keyframes grow{0%{transform:scale(0) rotate(-12deg)}100%{transform:scale(1) rotate(0)}}
@keyframes bounce{0%{transform:scale(0)}55%{transform:scale(1.3)}75%{transform:scale(.9)}100%{transform:scale(1)}}
@keyframes popc{0%{transform:translate(-50%,-50%) scale(0)}70%{transform:translate(-50%,-50%) scale(1.25)}100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes popx{0%{transform:translateX(-50%) scale(0)}70%{transform:translateX(-50%) scale(1.25)}100%{transform:translateX(-50%) scale(1)}}
@keyframes glow{0%{color:#fff}40%{color:#f5c84c;transform:scale(1.2)}100%{color:#fff;transform:scale(1)}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
</style>
</head>
<body>

<div id="ui"></div>
